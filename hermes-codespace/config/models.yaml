# Active provider = MODEL_PROVIDER; fallback = FALLBACK_PROVIDER (both in config/.env)
# Each provider reads its own key from the env var named in key_env.
providers:
  google:
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    key_env: GEMINI_API_KEY
    default_model: gemini-3-flash-preview
  openrouter:
    base_url: "https://openrouter.ai/api/v1"
    key_env: OPENROUTER_API_KEY
    default_model: google/gemini-3-flash-preview
    headers:
      HTTP-Referer: "https://github.com/codespaces"
      X-Title: "Hermes Codespace"
  openai:     { base_url: "https://api.openai.com/v1",            key_env: AI_API_KEY }
  anthropic:  { base_url: "https://api.anthropic.com/v1",         key_env: AI_API_KEY }
  nvidia_nim: { base_url: "https://integrate.api.nvidia.com/v1",  key_env: AI_API_KEY }
  glm:        { base_url: "https://open.bigmodel.cn/api/paas/v4", key_env: AI_API_KEY }
  custom:     { base_url: "${CUSTOM_BASE_URL}",                   key_env: AI_API_KEY }
